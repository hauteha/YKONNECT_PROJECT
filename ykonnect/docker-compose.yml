services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    expose:
      - "8000"
    networks:
      - ykonnect_net
      - app_network

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - ykonnect_net

networks:
  ykonnect_net:
  app_network:
    external: true
